<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Clique Duplo - Foco no Site</title>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            text-align: center;
            max-width: 400px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            padding: 30px 20px;
            border-radius: 20px;
            border: 1px solid rgba(37, 211, 102, 0.3);
            box-shadow: 0 0 25px rgba(37, 211, 102, 0.2);
        }

        h2 {
            font-size: 20px;
            margin-bottom: 10px;
            color: #25d366;
        }

        p {
            font-size: 14px;
            color: #ccc;
            margin-bottom: 25px;
        }

        .btn-acao {
            background: linear-gradient(135deg, #25d366, #128c7e);
            color: #000;
            font-weight: 800;
            font-size: 16px;
            padding: 15px 25px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-acao:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Página de Teste 🚀🚀</h2>
        <p>Clique no botão para abrir o site principal no foco e o anúncio em segundo plano.</p>

        <button class="btn-acao" onclick="executarPopunderInverso()">
            👉 ENTRAR NO SITE
        </button>
    </div>

    <script>
        function executarPopunderInverso() {
            const linkAnuncio = "https://auctionr.org/4/5f6de430d75a855ddff7717775ff4ae3";
            const linkDestino = "https://flow-af3j.onrender.com/";

            // 1. Abre o seu site do Render em uma nova aba e dá o FOCO nela
            const novaAba = window.open(linkDestino, '_blank');
            if (novaAba) {
                novaAba.focus();
            }

            // 2. Transforma a aba antiga (onde o usuário clicou) no anúncio do Adsterra
            window.location.href = linkAnuncio;
        }
    </script>

</body>
</html>
