<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grupos WhatsApp 💬 FLOW</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #000000;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .btn-ver-grupos {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 320px;
            padding: 18px;
            background: #25d366;
            color: #000;
            font-size: 20px;
            font-weight: 800;
            text-decoration: none;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(37, 211, 102, 0.5);
            transition: transform 0.2s, opacity 0.2s;
            cursor: pointer;
            border: none;
            outline: none;
        }
        .btn-ver-grupos:hover {
            opacity: 0.9;
            transform: scale(1.03);
        }
    </style>
</head>
<body>

    <button class="btn-ver-grupos" onclick="abrirPopunder(event)">Ver Grupos</button>

    <script>
        function abrirPopunder(event) {
            event.preventDefault();
            
            // Seu anúncio do Adsterra
            const linkAnuncio = "https://auctionr.org/4/5f6de430d75a855ddff7717775ff4ae3";
            
            // Seu site principal que DEVE ficar na frente
            const sitePrincipal = "https://flow-af3j.onrender.com";

            // 1. Abre o anúncio em uma nova aba
            const abaAnuncio = window.open(linkAnuncio, '_blank');
            
            // 2. Tira o foco da nova aba e joga o anúncio para trás (segundo plano)
            if (abaAnuncio) {
                abaAnuncio.blur();
                window.focus();
            }

            // 3. Redireciona a aba principal para o seu site na frente
            window.location.href = sitePrincipal;
        }
    </script>

</body>
</html>
