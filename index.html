    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body {
            background-color: #000000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        /* Vídeo de fundo fixo e travado para não interagir nem baixar */
        .video-fundo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover; 
            z-index: -2;
            filter: brightness(0.7); 
            pointer-events: none; /* Impede qualquer clique direto no vídeo */
        }
        /* Overlay para dar contraste */
        .overlay-fundo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.35);
            z-index: -1;
            pointer-events: none;
        }
        /* Container do script de anúncio */

            z-index: 2;
        }
        .btn-ver-grupos {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 320px;
            padding: 18px;
            background: #25d366;
            color: #000;
            font-size: 20px;
            font-weight: 800;
            text-decoration: none;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(37, 211, 102, 0.5);
            cursor: pointer;
            border: none;
            outline: none;
            z-index: 2;
            transition: transform 0.2s, opacity 0.2s;

        .btn-ver-grupos:hover { opacity: 0.9; transform: scale(1.03); }
