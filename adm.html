<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Painel Administrativo - FLOW</title>
    <style>
        :root {
            --primary: #25d366;
            --danger: #ff4d4d;
            --dark-bg: #0d1117;
            --card-bg: #161b22;
            --text: #f0f6fc;
            --border: #30363d;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body {
            background-color: var(--dark-bg);
            color: var(--text);
            min-height: 100vh;
            padding: 20px 12px 60px;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
        }
        header h1 { font-size: 22px; color: var(--primary); font-weight: 800; }
        header p { font-size: 13px; color: #8b949e; margin-top: 4px; }

        /* Login Box */
        .login-box {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 25px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        .login-box h2 { font-size: 18px; margin-bottom: 15px; color: var(--text); }
        .login-box input, .login-box select, .login-box textarea {
            width: 100%;
            padding: 12px;
            background: #0d1117;
            border: 1px solid var(--border);
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            margin-bottom: 15px;
            outline: none;
        }
        .login-box button, .btn-acao {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: #000;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
        }
        .login-box button:hover { opacity: 0.9; }

        /* Conteúdo do Painel */
        #painelConteudo { display: none; }
        
        .secao-titulo {
            font-size: 16px;
            font-weight: 700;
            margin: 25px 0 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--primary);
        }

        /* Caixa de Formulários */
        .form-adm-box {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 25px;
        }
        .form-adm-box label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #8b949e;
            margin-top: 10px;
            margin-bottom: 4px;
        }
        .form-adm-box input, .form-adm-box select {
            width: 100%;
            padding: 10px;
            background: #0d1117;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        .form-adm-box input:focus, .form-adm-box select:focus {
            border-color: var(--primary);
        }
        .btn-cadastrar-adm {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: #000;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            margin-top: 15px;
        }
        .btn-apagar-anuncio {
            background: var(--danger);
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
            position: relative;
        }

        /* Card de Denúncias */
        .card-denuncia {
            border-left: 4px solid var(--danger);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }
        .card-denuncia .motivo {
            font-size: 14px;
            font-weight: bold;
            color: var(--danger);
        }
        .card-denuncia .meta {
            font-size: 11px;
            color: #8b949e;
            margin-top: 4px;
            word-break: break-all;
        }
        .denuncia-botoes {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-shrink: 0;
        }

        /* Card de Grupos no ADM com Sistema de Mover */
        .card-grupo {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px 14px;
            margin-bottom: 10px;
            transition: transform 0.2s, background 0.2s;
        }
        .card-grupo.arrastando {
            opacity: 0.5;
            background: #21262d;
            border: 2px dashed var(--primary);
        }
        .drag-handle {
            cursor: grab;
            font-size: 18px;
            color: #8b949e;
            user-select: none;
            padding: 5px;
        }
        .card-grupo img {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary);
            flex-shrink: 0;
        }
        .grupo-info { flex: 1; overflow: hidden; }
        .grupo-nome { font-weight: bold; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .grupo-cat { font-size: 11px; color: #ffd700; margin-top: 2px; }
        .grupo-link { font-size: 11px; color: #58a6ff; text-decoration: none; word-break: break-all; display: inline-block; margin-top: 2px; }
        .grupo-cliques {
            font-size: 11px;
            color: #25d366;
            font-weight: bold;
            margin-top: 3px;
        }

        /* Controles de Ordem e Ações */
        .grupo-controles-ordem {
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: center;
        }
        .btn-ordem {
            background: #21262d;
            color: #fff;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 11px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-ordem:hover { background: #30363d; color: var(--primary); }

        .grupo-acoes-diretas {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-shrink: 0;
            margin-left: 8px;
        }
        .btn-remover {
            background: var(--danger);
            color: #fff;
            border: none;
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
        }
        .btn-secundario {
            background: #21262d;
            color: #c9d1d9;
            border: 1px solid var(--border);
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
        }
        
        .vazio {
            text-align: center;
            color: #8b949e;
            font-size: 13px;
            padding: 15px;
            background: var(--card-bg);
            border-radius: 10px;
            border: 1px dashed var(--border);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .btn-salvar-ordem {
            background: var(--primary);
            color: #000;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(37,211,102,0.3);
        }
        .btn-atualizar {
            background: #21262d;
            color: var(--text);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>⚡ FLOW — Painel ADM</h1>
        <p>Gestão de Grupos, Moderação, Ordenação e Anúncios</p>
    </header>

    <!-- BOX DE LOGIN -->
    <div id="loginBox" class="login-box">
        <h2>🔒 Acesso Restrito</h2>
        <input type="password" id="senhaAdm" placeholder="Digite a Senha de Administrador">
        <button onclick="autenticar()">Entrar no Painel</button>
    </div>

    <!-- CONTEÚDO DO PAINEL -->
    <div id="painelConteudo">
        <div class="top-bar">
            <span style="font-size: 13px; color: #8b949e;">Status: <b style="color:var(--primary);">Autenticado</b></span>
            <div>
                <button class="btn-atualizar" onclick="carregarDados()">🔄 Atualizar</button>
                <button class="btn-salvar-ordem" onclick="salvarOrdemServidor()">💾 Salvar Nova Ordem</button>
            </div>
        </div>

        <!-- ⚙️ GESTÃO DO CARD FLUTUANTE DE DESTAQUE -->
        <div class="secao-titulo">
            <span>⚙️ Configurar Card Flutuante</span>
        </div>
        <div class="form-adm-box">
            <form onsubmit="salvarPromo(event)">
                <label>Status do Card:</label>
                <select id="promoAtivo">
                    <option value="true">✅ Ativado no Site</option>
                    <option value="false">❌ Desativado</option>
                </select>

                <label>URL da Imagem:</label>
                <input type="text" id="promoFoto" required placeholder="https://i.postimg.cc/...">

                <label>Título do Destaque:</label>
                <input type="text" id="promoNome" required placeholder="Ex: Entrar no Grupo 🔥">

                <label>Texto Descritivo:</label>
                <input type="text" id="promoTexto" required placeholder="Ex: Clique abaixo para garantir sua vaga!">

                <label>Link de Destino:</label>
                <input type="text" id="promoLink" required placeholder="Cole qualquer link aqui...">

                <label>Duração do Contador (Segundos):</label>
                <input type="number" id="promoDuracao" required min="1" max="60" value="5">

                <button type="submit" class="btn-cadastrar-adm">💾 Salvar Configurações do Card</button>
                <button type="button" class="btn-apagar-anuncio" onclick="apagarPromo()">🗑️ Apagar Anúncio do Banco</button>
            </form>
        </div>

        <!-- FORMULÁRIO DE CADASTRO LIVRE -->
        <div class="secao-titulo">
            <span>🚀 Cadastrar Link/Grupo Gratuitamente</span>
        </div>
        <div class="form-adm-box">
            <form id="formCadAdm" onsubmit="cadastrarDiretoAdm(event)">
                <label>Nome do Grupo / Título:</label>
                <input type="text" id="admNome" required placeholder="Ex: Meu Link / Grupo VIP">
                
                <label>Link de Destino:</label>
                <input type="text" id="admLink" required placeholder="Cole qualquer link aqui...">
                
                <label>Categoria:</label>
                <select id="admCat">
                    <option value="Amizade">Amizade</option>
                    <option value="Namoro">Namoro</option>
                    <option value="Zoeira">Zoeira</option>
                    <option value="Figurinhas">Figurinhas</option>
                    <option value="Outros">Outros</option>
                </select>
                
                <label>Descrição curta (Máx 30 caracteres):</label>
                <input type="text" id="admDesc" maxlength="30" placeholder="Ex: Link oficial">
                
                <label>Escolher Foto da Galeria:</label>
                <input type="file" id="admFotoFile" accept="image/*" style="padding: 6px;">

                <button type="submit" class="btn-cadastrar-adm">✨ Publicar Link Grátis</button>
            </form>
        </div>

        <!-- SEÇÃO DE DENÚNCIAS -->
        <div class="secao-titulo">
            <span>🚨 Denúncias Recebidas</span>
        </div>
        <div id="listaDenuncias">
            <p class="vazio">Carregando denúncias...</p>
        </div>

        <!-- SEÇÃO DE GERENCIAMENTO DE POSIÇÃO E REORDENAÇÃO -->
        <div class="secao-titulo">
            <span>☰ Mover Posição dos Grupos (Arraste ou Use ⬆️⬇️)</span>
            <button class="btn-salvar-ordem" onclick="salvarOrdemServidor()" style="font-size:11px; padding:4px 10px;">💾 Salvar Ordem</button>
        </div>
        <div id="listaGrupos">
            <p class="vazio">Carregando grupos...</p>
        </div>
    </div>
</div>

<script>
let senhaSalva = "";
let listaGruposLocais = [];

async function autenticar() {
    const senhaInput = document.getElementById('senhaAdm').value;
    if(!senhaInput) {
        alert("Por favor, digite a senha!");
        return;
    }
    senhaSalva = senhaInput;
    localStorage.setItem('flow_admin_auth', 'true');
    await carregarDados();
}

async function carregarDados() {
    try {
        let res = await fetch('/api/adm/dados', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ senha: senhaSalva })
        });
        let data = await res.json();

        if(res.status === 401 || data.erro) {
            alert("❌ Senha incorreta!");
            document.getElementById('loginBox').style.display = 'block';
            document.getElementById('painelConteudo').style.display = 'none';
            return;
        }

        document.getElementById('loginBox').style.display = 'none';
        document.getElementById('painelConteudo').style.display = 'block';

        if(data.promo) {
            document.getElementById('promoAtivo').value = data.promo.ativo ? "true" : "false";
            document.getElementById('promoFoto').value = data.promo.foto || "";
            document.getElementById('promoNome').value = data.promo.nome || "";
            document.getElementById('promoTexto').value = data.promo.texto || "";
            document.getElementById('promoLink').value = data.promo.link || "";
            document.getElementById('promoDuracao').value = data.promo.duracao || 5;
        }

        renderizarDenuncias(data.denuncias || []);
        
        // ORDENAÇÃO AUTOMÁTICA POR CLIQUES (EXATAMENTE IGUAL AO SITE PRINCIPAL)
        listaGruposLocais = data.grupos || [];
        listaGruposLocais.sort((a, b) => {
            let cliquesA = (a.cliques_unicos && Array.isArray(a.cliques_unicos)) ? a.cliques_unicos.length : (a.acessos || a.cliques || 0);
            let cliquesB = (b.cliques_unicos && Array.isArray(b.cliques_unicos)) ? b.cliques_unicos.length : (b.acessos || b.cliques || 0);
            return cliquesB - cliquesA;
        });

        renderizarGrupos(listaGruposLocais);

    } catch(e) {
        console.error(e);
        alert("Erro ao conectar ao servidor.");
    }
}

function escaparHTML(str) {
    if (!str) return '';
    return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
    );
}

// SISTEMA DE RENDERIZAÇÃO E REORDENAÇÃO DE GRUPOS VIA ADM
function renderizarGrupos(grupos) {
    const cont = document.getElementById('listaGrupos');
    if(grupos.length === 0) {
        cont.innerHTML = '<p class="vazio">Nenhum grupo cadastrado no banco de dados.</p>';
        return;
    }

    cont.innerHTML = grupos.map((g, index) => {
        let totalCliques = (g.cliques_unicos && Array.isArray(g.cliques_unicos)) ? g.cliques_unicos.length : (g.acessos || g.cliques || 0);

        return `
            <div class="card-grupo" draggable="true" data-index="${index}" data-id="${g._id}">
                <div class="drag-handle" title="Arraste para mover">☰</div>
                <img src="${escaparHTML(g.foto || 'https://files.catbox.moe/0aa6f2.png')}" alt="Foto">
                <div class="grupo-info">
                    <div class="grupo-nome">#${index + 1} - ${escaparHTML(g.nome)}</div>
                    <div class="grupo-cat">${escaparHTML(g.categoria)}</div>
                    <div class="grupo-cliques">🔥 Cliques: ${totalCliques}</div>
                </div>
                <div class="grupo-controles-ordem">
                    <button class="btn-ordem" onclick="moverItemLocal(${index}, -1)">⬆️</button>
                    <button class="btn-ordem" onclick="moverItemLocal(${index}, 1)">⬇️</button>
                </div>
                <div class="grupo-acoes-diretas">
                    <button class="btn-remover" onclick="removerGrupo('${escaparHTML(g._id)}')">🗑️ Rem</button>
                </div>
            </div>
        `;
    }).join('');

    iniciarDragAndDrop();
}

// LÓGICA DE MOVER LOCALMENTE (SUBIR / DESCER)
function moverItemLocal(index, direcao) {
    let novoIndex = index + direcao;
    if(novoIndex < 0 || novoIndex >= listaGruposLocais.length) return;

    let temp = listaGruposLocais[index];
    listaGruposLocais[index] = listaGruposLocais[novoIndex];
    listaGruposLocais[novoIndex] = temp;

    renderizarGrupos(listaGruposLocais);
}

// LÓGICA DE ARRASTAR E SOLTAR (DRAG & DROP)
let itemArrastadoIndex = null;

function iniciarDragAndDrop() {
    const cards = document.querySelectorAll('.card-grupo');
    cards.forEach(card => {
        card.addEventListener('dragstart', (e) => {
            itemArrastadoIndex = parseInt(card.getAttribute('data-index'));
            card.classList.add('arrastando');
        });

        card.addEventListener('dragend', () => {
            card.classList.remove('arrastando');
        });

        card.addEventListener('dragover', (e) => {
            e.preventDefault();
        });

        card.addEventListener('drop', (e) => {
            e.preventDefault();
            const alvoIndex = parseInt(card.getAttribute('data-index'));
            if (itemArrastadoIndex !== null && itemArrastadoIndex !== alvoIndex) {
                const itemRemovido = listaGruposLocais.splice(itemArrastadoIndex, 1)[0];
                listaGruposLocais.splice(alvoIndex, 0, itemRemovido);
                renderizarGrupos(listaGruposLocais);
            }
        });
    });
}

// SALVAR A NOVA POSIÇÃO NO BANCO DE DADOS DO SERVIDOR
async function salvarOrdemServidor() {
    if(listaGruposLocais.length === 0) return;

    let novaOrdemIds = listaGruposLocais.map(g => g._id);

    try {
        let res = await fetch('/api/adm/salvar-ordem', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ senha: senhaSalva, ordem: novaOrdemIds })
        });
        let data = await res.json();

        if(data.sucesso) {
            alert("✅ Nova ordem dos grupos salva com sucesso no banco!");
            carregarDados();
        } else {
            alert("❌ Erro ao salvar ordem: " + (data.erro || 'Erro desconhecido'));
        }
    } catch(err) {
        console.error(err);
        alert("Erro na requisição ao servidor.");
    }
}

async function salvarPromo(e) {
    e.preventDefault();
    let promo = {
        ativo: document.getElementById('promoAtivo').value === "true",
        foto: document.getElementById('promoFoto').value,
        nome: document.getElementById('promoNome').value,
        texto: document.getElementById('promoTexto').value,
        link: document.getElementById('promoLink').value,
        duracao: parseInt(document.getElementById('promoDuracao').value) || 5
    };

    try {
        let res = await fetch('/api/adm/salvar-promo', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ senha: senhaSalva, promo })
        });
        let data = await res.json();
        if(data.sucesso) {
            alert("✅ Configurações salvas com sucesso!");
        } else {
            alert("❌ Erro ao salvar: " + (data.erro || 'Desconhecido'));
        }
    } catch(err) {
        console.error(err);
        alert("Erro na requisição.");
    }
}

async function apagarPromo() {
    if(!confirm("Tem certeza de que deseja apagar o anúncio flutuante?")) return;

    try {
        let res = await fetch('/api/adm/apagar-promo', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ senha: senhaSalva })
        });
        let data = await res.json();
        if(data.sucesso) {
            alert("✅ Anúncio removido!");
            carregarDados();
        } else {
            alert("❌ Erro: " + (data.erro || 'Desconhecido'));
        }
    } catch(err) {
        console.error(err);
        alert("Erro na requisição.");
    }
}

function renderizarDenuncias(denuncias) {
    const cont = document.getElementById('listaDenuncias');
    if(denuncias.length === 0) {
        cont.innerHTML = '<p class="vazio">Nenhuma denúncia pendente. 🎉</p>';
        return;
    }

    cont.innerHTML = denuncias.map(d => `
        <div class="card card-denuncia">
            <div>
                <div class="motivo">⚠️ Motivo: ${escaparHTML(d.motivo)}</div>
                <div class="meta">ID Grupo: <code>${escaparHTML(d.grupo_id || 'N/A')}</code></div>
            </div>
            <div class="denuncia-botoes">
                ${d.grupo_id ? `<button class="btn-remover" onclick="removerGrupo('${escaparHTML(d.grupo_id)}')">🗑️ Apagar Grupo</button>` : ''}
                <button class="btn-secundario" onclick="removerDenuncia('${escaparHTML(d._id || d.id)}')">❌ Limpar</button>
            </div>
        </div>
    `).join('');
}

function converterArquivoParaBase64(file) {
    return new Promise((resolve, reject) => {
        if (!file) { resolve(""); return; }
        let reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
    });
}

async function cadastrarDiretoAdm(e) {
    e.preventDefault();
    let nome = document.getElementById('admNome').value;
    let link = document.getElementById('admLink').value;
    let categoria = document.getElementById('admCat').value;
    let descricao = document.getElementById('admDesc').value;
    let fotoFile = document.getElementById('admFotoFile').files[0];

    let fotoBase64 = "";
    if (fotoFile) {
        try { fotoBase64 = await converterArquivoParaBase64(fotoFile); } 
        catch(err) { console.error(err); }
    }

    try {
        let res = await fetch('/api/adm/cadastrar', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ senha: senhaSalva, nome, link, categoria, descricao, foto: fotoBase64 })
        });
        let data = await res.json();

        if(data.sucesso) {
            alert("✅ Link publicado!");
            document.getElementById('formCadAdm').reset();
            carregarDados();
        } else {
            alert("❌ Erro: " + (data.erro || 'Erro desconhecido'));
        }
    } catch(err) {
        console.error(err);
        alert("Erro na requisição.");
    }
}

async function removerGrupo(id) {
    if(!confirm("Deseja apagar este grupo permanentemente?")) return;

    try {
        let res = await fetch('/api/adm/remover', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ senha: senhaSalva, id: id })
        });
        let data = await res.json();

        if(data.sucesso) {
            alert("✅ Removido!");
            carregarDados();
        } else {
            alert("❌ Erro: " + (data.erro || 'Erro desconhecido'));
        }
    } catch(e) {
        console.error(e);
        alert("Erro na requisição.");
    }
}
