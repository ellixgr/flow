<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4">

<div id="telaLogin" class="max-w-md mx-auto mt-20 bg-white p-6 rounded shadow-lg">
    <h2 class="text-xl font-bold text-center mb-6">🔐 Acesso Administrativo</h2>
    <input type="email" id="email" class="w-full border p-3 rounded mb-3" placeholder="Seu e-mail cadastrado">
    <input type="password" id="senha" class="w-full border p-3 rounded mb-4" placeholder="Sua senha">
    <button onclick="entrar()" class="w-full bg-green-600 text-white p-3 rounded font-medium">Entrar</button>
    <p id="avisoErro" class="text-red-600 text-center mt-3 hidden">❌ E-mail ou senha incorretos!</p>
</div>

<div id="painel" class="hidden max-w-5xl mx-auto">
    <div class="bg-white rounded shadow p-6 mb-4 flex justify-between items-center">
        <h1 class="text-2xl font-bold">📋 Gerenciar Sistema</h1>
        <button onclick="sair()" class="bg-red-500 text-white px-3 py-1 rounded">Sair</button>
    </div>

    <!-- Abas de navegação -->
    <div class="bg-white rounded shadow p-4 mb-4 flex flex-wrap gap-2">
        <button onclick="mudarAba('grupos')" id="abaGrupos" class="bg-blue-600 text-white px-3 py-1 rounded">📌 Grupos</button>
        <button onclick="mudarAba('denuncias')" id="abaDenuncias" class="bg-red-600 text-white px-3 py-1 rounded">🚨 Denúncias</button>
    </div>

    <!-- Filtros para grupos -->
    <div id="filtrosGrupos" class="bg-white rounded shadow p-4 mb-4 flex flex-wrap gap-2">
        <button onclick="filtrar('analise')" class="bg-yellow-500 text-white px-3 py-1 rounded">Pendentes / Em Análise</button>
        <button onclick="filtrar('aprovado')" class="bg-green-500 text-white px-3 py-1 rounded">Aprovados</button>
        <button onclick="filtrar('recusado')" class="bg-red-500 text-white px-3 py-1 rounded">Recusados</button>
    </div>

    <!-- Conteúdo dinâmico -->
    <div id="listaConteudo" class="space-y-4"></div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCbn1DaAw4Uz5MzNDKGfL7O2fPXbhswuXM",
  authDomain: "almanaque-2d45c.firebaseapp.com",
  projectId: "almanaque-2d45c",
  storageBucket: "almanaque-2d45c.firebasestorage.app",
  messagingSenderId: "438098113685",
  appId: "1:438098113685:web:ee38a615cdf1166be9979c"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();
let filtroAtual = "analise";
let abaAtual = "grupos";

async function entrar() {
  const email = document.getElementById("email").value.trim();
  const senha = document.getElementById("senha").value.trim();
  if (!email || !senha) return;

  try {
    await auth.signInWithEmailAndPassword(email, senha);
    document.getElementById("telaLogin").classList.add("hidden");
    document.getElementById("painel").classList.remove("hidden");
    mudarAba('grupos');
  } catch (erro) {
    console.error("Erro login:", erro);
    document.getElementById("avisoErro").classList.remove("hidden");
    setTimeout(() => document.getElementById("avisoErro").classList.add("hidden"), 3000);
  }
}

function sair() {
  auth.signOut();
  document.getElementById("painel").classList.add("hidden");
  document.getElementById("telaLogin").classList.remove("hidden");
  document.getElementById("email").value = "";
  document.getElementById("senha").value = "";
}

function mudarAba(aba) {
    abaAtual = aba;
    document.getElementById("abaGrupos").classList.remove("bg-blue-600");
    document.getElementById("abaDenuncias").classList.remove("bg-red-600");
    document.getElementById("filtrosGrupos").classList.add("hidden");

    if (aba === "grupos") {
        document.getElementById("abaGrupos").classList.add("bg-blue-600");
        document.getElementById("filtrosGrupos").classList.remove("hidden");
        carregarListaGrupos();
    } else {
        document.getElementById("abaDenuncias").classList.add("bg-red-600");
        carregarListaDenuncias();
    }
}

// ✅ CARREGAR GRUPOS
async function carregarListaGrupos() {
  const container = document.getElementById("listaConteudo");
  container.innerHTML = `<p class="text-center text-gray-500 py-10">Carregando...</p>`;

  try {
    const ref = db.collection("grupos").where("status", "==", filtroAtual);
    const snap = await ref.get();

    if (snap.empty) {
      container.innerHTML = `<p class="text-center text-gray-500 py-10">Nenhum grupo com status: <strong>${filtroAtual}</strong></p>`;
      return;
    }

    const grupos = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }))
      .sort((a, b) => {
        const dataA = a.dataEnvio?.toDate() || 0;
        const dataB = b.dataEnvio?.toDate() || 0;
        return dataB - dataA;
      });

    container.innerHTML = "";

    grupos.forEach(g => {
      const div = document.createElement("div");
      div.className = "border rounded p-4 flex flex-col md:flex-row gap-4 items-center justify-between bg-white";

      div.innerHTML = `
        <div class="flex items-center gap-4 w-full md:w-auto">
          <img src="${g.foto || ''}" class="w-16 h-16 rounded-full object-cover border" alt="Foto do grupo">
          <div class="flex-1">
            <h3 class="font-bold text-lg">${g.nome || 'Sem nome'}</h3>
            <p class="text-sm text-gray-600 uppercase">${g.categoria || 'Sem categoria'}</p>
            <p class="text-xs text-gray-500 mt-1">Status: <span class="font-semibold ${
              g.status === 'analise' ? 'text-yellow-600' :
              g.status === 'aprovado' ? 'text-green-600' : 'text-red-600'
            }">${g.status}</span></p>
            <a href="${g.link || '#'}" target="_blank" rel="noopener noreferrer" class="text-blue-600 text-xs mt-1 inline-block">🔗 Abrir link do grupo</a>
          </div>
        </div>
        <div class="flex gap-2 w-full md:w-auto justify-center">
          <button onclick="alterar('${g.id}', 'aprovado')" class="bg-green-600 hover:bg-green-700 text-white px-3 py-1 rounded text-sm">✅ Aprovar</button>
          <button onclick="alterar('${g.id}', 'recusado')" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1 rounded text-sm">❌ Recusar</button>
          <button onclick="apagar('${g.id}')" class="bg-gray-700 hover:bg-gray-800 text-white px-3 py-1 rounded text-sm">🗑️ Apagar</button>
        </div>
      `;

      container.appendChild(div);
    });

  } catch (erro) {
    console.error("Erro ao carregar grupos:", erro);
    container.innerHTML = `<p class="text-center text-red-500 py-10">❌ Erro: ${erro.message}</p>`;
  }
}

// ✅ CARREGAR DENÚNCIAS
async function carregarListaDenuncias() {
  const container = document.getElementById("listaConteudo");
  container.innerHTML = `<p class="text-center text-gray-500 py-10">Carregando denúncias...</p>`;

  try {
    const snap = await db.collection("denuncias").orderBy("data", "desc").get();

    if (snap.empty) {
      container.innerHTML = `<p class="text-center text-gray-500 py-10">Nenhuma denúncia recebida.</p>`;
      return;
    }

    container.innerHTML = "";

    for (const doc of snap.docs) {
      const d = { id: doc.id, ...doc.data() };
      let grupo = null;
      try {
        const grupoSnap = await db.collection("grupos").doc(d.grupoId).get();
        if (grupoSnap.exists) grupo = { id: grupoSnap.id, ...grupoSnap.data() };
      } catch (e) {}

      const div = document.createElement("div");
      div.className = "border border-red-200 rounded p-4 bg-red-50 flex flex-col md:flex-row gap-4 justify-between";

      div.innerHTML = `
        <div class="flex-1">
          <h4 class="font-bold text-red-700">🚨 Denúncia</h4>
          <p class="text-sm mt-1"><strong>Motivo:</strong> ${d.motivo.replace("_", " ")}</p>
          <p class="text-xs text-gray-600 mt-1">Data: ${d.data?.toDate().toLocaleString("pt-BR") || "Não informado"}</p>
          ${grupo ? `
            <div class="mt-2 p-2 bg-white rounded border">
              <p><strong>Grupo:</strong> ${grupo.nome}</p>
              <p class="text-xs"><strong>Status:</strong> ${grupo.status}</p>
              <a href="${grupo.link}" target="_blank" class="text-blue-600 text-xs mt-1 inline-block">🔗 Abrir link</a>
            </div>
          ` : `<p class="text-xs text-gray-500 mt-2">❌ Grupo não encontrado ou já removido</p>`}
        </div>
        <div class="flex flex-wrap gap-2 items-center">
          ${grupo ? `
            <button onclick="alterar('${grupo.id}', 'aprovado')" class="bg-green-600 text-white px-2 py-1 rounded text-xs">✅ Aprovar</button>
            <button onclick="alterar('${grupo.id}', 'recusado')" class="bg-orange-500 text-white px-2 py-1 rounded text-xs">❌ Recusar</button>
            <button onclick="apagar('${grupo.id}')" class="bg-red-600 text-white px-2 py-1 rounded text-xs">🗑️ Apagar Grupo</button>
          ` : ''}
          <button onclick="apagarDenuncia('${d.id}')" class="bg-gray-600 text-white px-2 py-1 rounded text-xs">🗑️ Apagar Denúncia</button>
        </div>
      `;

      container.appendChild(div);
    }

  } catch (erro) {
    console.error("Erro ao carregar denúncias:", erro);
    container.innerHTML = `<p class="text-center text-red-500 py-10">❌ Erro: ${erro.message}</p>`;
  }
}

async function alterar(id, novoStatus) {
  try {
    await db.collection("grupos").doc(id).update({
      status: novoStatus,
      dataAlteracao: firebase.firestore.FieldValue.serverTimestamp()
    });
    if (abaAtual === "grupos") carregarListaGrupos();
    else carregarListaDenuncias();
    alert(`✅ Grupo alterado para: ${novoStatus}`);
  } catch (erro) {
    console.error("Erro alterar:", erro);
    alert("❌ Erro ao alterar! Verifique permissões.");
  }
}

async function apagar(id) {
  if (!confirm("Tem certeza que quer apagar esse grupo? Essa ação não pode ser desfeita.")) return;
  try {
    await db.collection("grupos").doc(id).delete();
    if (abaAtual === "grupos") carregarListaGrupos();
    else carregarListaDenuncias();
    alert("✅ Grupo apagado com sucesso!");
  } catch (erro) {
    console.error("Erro apagar:", erro);
    alert("❌ Sem permissão para apagar ou erro no banco.");
  }
}

async function apagarDenuncia(id) {
  if (!confirm("Apagar apenas a denúncia?")) return;
  try {
    await db.collection("denuncias").doc(id).delete();
    carregarListaDenuncias();
    alert("✅ Denúncia removida!");
  } catch (erro) {
    alert("❌ Erro ao remover denúncia.");
  }
}

function filtrar(tipo) {
  filtroAtual = tipo;
  carregarListaGrupos();
}
</script>

</body>
</html>
