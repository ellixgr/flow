<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4">

<div id="telaLogin" class="max-w-md mx-auto mt-20 bg-white p-6 rounded shadow-lg">
    <h2 class="text-xl font-bold text-center mb-6">🔐 Acesso Administrativo</h2>
    <input type="email" id="email" class="w-full border p-3 rounded mb-3" placeholder="E-mail admin">
    <input type="password" id="senha" class="w-full border p-3 rounded mb-4" placeholder="Senha">
    <button onclick="entrar()" class="w-full bg-green-600 text-white p-3 rounded font-medium">Entrar</button>
    <p id="avisoErro" class="text-red-600 text-center mt-3 hidden">❌ Dados incorretos!</p>
</div>

<div id="painel" class="hidden max-w-5xl mx-auto">
    <div class="bg-white rounded shadow p-6 mb-4 flex justify-between items-center">
        <h1 class="text-2xl font-bold">📋 Gerenciar Sistema</h1>
        <button onclick="sair()" class="bg-red-500 text-white px-3 py-1 rounded">Sair</button>
    </div>

    <div class="bg-white rounded shadow p-4 mb-4 flex flex-wrap gap-2">
        <button onclick="mudarAba('grupos')" id="abaGrupos" class="bg-blue-600 text-white px-3 py-1 rounded">📌 Grupos</button>
        <button onclick="mudarAba('denuncias')" id="abaDenuncias" class="bg-red-600 text-white px-3 py-1 rounded">🚨 Denúncias</button>
    </div>

    <div id="listaConteudo" class="space-y-4"></div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCbn1DaAw4Uz5MzNDKGfL7O2fPXbhswuXM",
  authDomain: "almanaque-2d45c.firebaseapp.com",
  projectId: "almanaque-2d45c",
  storageBucket: "almanaque-2d45c.firebasestorage.app",
  messagingSenderId: "438098113685",
  appId: "1:438098113685:web:ee38a615cdf1166be9979c"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();
let abaAtual = "grupos";

// Login
async function entrar() {
  const email = document.getElementById("email").value.trim();
  const senha = document.getElementById("senha").value.trim();
  try {
    await auth.signInWithEmailAndPassword(email, senha);
    document.getElementById("telaLogin").classList.add("hidden");
    document.getElementById("painel").classList.remove("hidden");
    mudarAba('grupos');
  } catch (erro) {
    document.getElementById("avisoErro").classList.remove("hidden");
    setTimeout(() => document.getElementById("avisoErro").classList.add("hidden"), 3000);
  }
}

function sair() {
  auth.signOut();
  document.getElementById("painel").classList.add("hidden");
  document.getElementById("telaLogin").classList.remove("hidden");
}

// Trocar abas
function mudarAba(aba) {
    abaAtual = aba;
    document.getElementById("abaGrupos").classList.remove("bg-blue-600");
    document.getElementById("abaDenuncias").classList.remove("bg-red-600");

    if (aba === "grupos") {
        document.getElementById("abaGrupos").classList.add("bg-blue-600");
        carregarGrupos();
    } else {
        document.getElementById("abaDenuncias").classList.add("bg-red-600");
        carregarDenuncias();
    }
}

// Carregar lista de grupos
async function carregarGrupos() {
  const container = document.getElementById("listaConteudo");
  container.innerHTML = `<p class="text-center text-gray-500 py-10">Carregando...</p>`;

  try {
    const snap = await db.collection("grupos").orderBy("dataEnvio", "desc").get();
    if (snap.empty) {
      container.innerHTML = `<p class="text-center text-gray-500 py-10">Nenhum grupo cadastrado.</p>`;
      return;
    }

    container.innerHTML = "";
    snap.docs.forEach(doc => {
      const g = { id: doc.id, ...doc.data() };
      const div = document.createElement("div");
      div.className = "border rounded p-4 flex flex-col md:flex-row gap-4 items-center justify-between bg-white";

      div.innerHTML = `
        <div class="flex items-center gap-4 w-full md:w-auto">
          <img src="${g.foto || ''}" class="w-16 h-16 rounded-full object-cover border" alt="Grupo">
          <div class="flex-1">
            <h3 class="font-bold text-lg">${g.nome || 'Sem nome'}</h3>
            <p class="text-sm text-gray-600">${g.categoria || 'Sem categoria'}</p>
            <p class="text-xs mt-1">Status: <span class="font-semibold ${
              g.status === 'denunciado' ? 'text-red-600' :
              g.status === 'aprovado' ? 'text-green-600' :
              g.status === 'recusado' ? 'text-orange-600' : 'text-yellow-600'
            }">${g.status || 'analise'}</span></p>
            <a href="${g.link || '#'}" target="_blank" class="text-blue-600 text-xs mt-1 inline-block">🔗 Abrir</a>
          </div>
        </div>
        <div class="flex flex-wrap gap-2 justify-center">
          <button onclick="marcarDenunciado('${g.id}')" class="bg-red-600 text-white px-2 py-1 rounded text-sm">🚩 Marcar como Denunciado</button>
          <button onclick="retirarDenuncia('${g.id}', '${g.statusAnterior || 'analise'}')" class="bg-yellow-500 text-white px-2 py-1 rounded text-sm">✅ Retirar Denúncia</button>
          <button onclick="excluirGrupo('${g.id}')" class="bg-gray-700 text-white px-2 py-1 rounded text-sm">🗑️ Excluir Grupo</button>
        </div>
      `;
      container.appendChild(div);
    });
  } catch (erro) {
    container.innerHTML = `<p class="text-center text-red-500 py-10">❌ Erro: ${erro.message}</p>`;
  }
}

// Carregar lista de denúncias
async function carregarDenuncias() {
  const container = document.getElementById("listaConteudo");
  container.innerHTML = `<p class="text-center text-gray-500 py-10">Carregando denúncias...</p>`;

  try {
    const snap = await db.collection("denuncias").orderBy("data", "desc").get();
    if (snap.empty) {
      container.innerHTML = `<p class="text-center text-gray-500 py-10">Nenhuma denúncia recebida.</p>`;
      return;
    }

    container.innerHTML = "";
    for (const doc of snap.docs) {
      const d = { id: doc.id, ...doc.data() };
      const grupoSnap = await db.collection("grupos").doc(d.grupoId).get();
      if (!grupoSnap.exists) {
        await db.collection("denuncias").doc(d.id).delete();
        continue;
      }
      const g = { id: grupoSnap.id, ...grupoSnap.data() };

      const div = document.createElement("div");
      div.className = "border border-red-200 rounded p-4 bg-red-50 flex flex-col md:flex-row gap-4 justify-between";

      div.innerHTML = `
        <div class="flex-1">
          <h4 class="font-bold text-red-700">🚨 Denúncia</h4>
          <p class="text-sm"><strong>Motivo:</strong> ${d.motivo.replace("_", " ")}</p>
          <p class="text-xs text-gray-600">Data: ${d.data?.toDate().toLocaleString("pt-BR") || "Não informado"}</p>
          <div class="mt-2 p-2 bg-white rounded border">
            <p><strong>Grupo:</strong> ${g.nome}</p>
            <p class="text-xs">Status atual: <span class="font-semibold ${g.status === 'denunciado' ? 'text-red-600' : 'text-gray-600'}">${g.status}</span></p>
            <a href="${g.link}" target="_blank" class="text-blue-600 text-xs mt-1 inline-block">🔗 Abrir grupo</a>
          </div>
        </div>
        <div class="flex flex-wrap gap-2 items-center">
          <button onclick="marcarDenunciado('${g.id}')" class="bg-red-600 text-white px-2 py-1 rounded text-sm">🚩 Marcar Denunciado</button>
          <button onclick="retirarDenuncia('${g.id}', '${g.status === 'aprovado' ? 'aprovado' : 'analise'}', '${d.id}')" class="bg-green-600 text-white px-2 py-1 rounded text-sm">✅ Retirar Denúncia</button>
          <button onclick="excluirGrupo('${g.id}')" class="bg-gray-700 text-white px-2 py-1 rounded text-sm">🗑️ Excluir Grupo</button>
        </div>
      `;
      container.appendChild(div);
    }
  } catch (erro) {
    container.innerHTML = `<p class="text-center text-red-500 py-10">❌ Erro: ${erro.message}</p>`;
  }
}

// Funções dos botões
async function marcarDenunciado(grupoId) {
  try {
    await db.collection("grupos").doc(grupoId).update({
      statusAnterior: firebase.firestore.FieldValue.serverTimestamp() ? await db.collection("grupos").doc(grupoId).get().then(d => d.data().status) : "analise",
      status: "denunciado"
    });
    mudarAba(abaAtual);
  } catch (e) {
    alert("Erro ao marcar como denunciado: " + e.message);
  }
}

async function retirarDenuncia(grupoId, statusOriginal, denunciaId = null) {
  try {
    await db.collection("grupos").doc(grupoId).update({
      status: statusOriginal,
      statusAnterior: null
    });
    if (denunciaId) await db.collection("denuncias").doc(denunciaId).delete();
    mudarAba(abaAtual);
  } catch (e) {
    alert("Erro ao retirar denúncia: " + e.message);
  }
}

async function excluirGrupo(grupoId) {
  if (!confirm("Tem certeza que quer EXCLUIR esse grupo DEFINITIVAMENTE?")) return;
  try {
    await db.collection("grupos").doc(grupoId).delete();
    const denuncias = await db.collection("denuncias").where("grupoId", "==", grupoId).get();
    denuncias.forEach(d => d.ref.delete());
    mudarAba(abaAtual);
  } catch (e) {
    alert("Erro ao excluir grupo: " + e.message);
  }
}
</script>
</body>
</html>
