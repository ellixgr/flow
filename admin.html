<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4">

<div id="telaLogin" class="max-w-md mx-auto mt-20 bg-white p-6 rounded shadow-lg">
    <h2 class="text-xl font-bold text-center mb-6">🔐 Acesso Administrativo</h2>
    <input type="email" id="email" class="w-full border p-3 rounded mb-3" placeholder="Seu e-mail cadastrado">
    <input type="password" id="senha" class="w-full border p-3 rounded mb-4" placeholder="Sua senha">
    <button onclick="entrar()" class="w-full bg-green-600 text-white p-3 rounded font-medium">Entrar</button>
    <p id="avisoErro" class="text-red-600 text-center mt-3 hidden">❌ E-mail ou senha incorretos!</p>
</div>

<div id="painel" class="hidden max-w-5xl mx-auto">
    <div class="bg-white rounded shadow p-6 mb-4 flex justify-between items-center">
        <h1 class="text-2xl font-bold">📋 Gerenciar Grupos</h1>
        <button onclick="sair()" class="bg-red-500 text-white px-3 py-1 rounded">Sair</button>
    </div>

    <div class="bg-white rounded shadow p-4 mb-4 flex gap-2">
        <button onclick="filtrar('analise')" class="bg-yellow-500 text-white px-3 py-1 rounded">Pendentes</button>
        <button onclick="filtrar('aprovado')" class="bg-green-500 text-white px-3 py-1 rounded">Aprovados</button>
        <button onclick="filtrar('todos')" class="bg-gray-500 text-white px-3 py-1 rounded">Todos</button>
    </div>

    <div id="listaGrupos" class="space-y-4"></div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCbn1DaAw4Uz5MzNDKGfL7O2fPXbhswuXM",
  authDomain: "almanaque-2d45c.firebaseapp.com",
  projectId: "almanaque-2d45c",
  storageBucket: "almanaque-2d45c.firebasestorage.app",
  messagingSenderId: "438098113685",
  appId: "1:438098113685:web:ee38a615cdf1166be9979c"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();
let filtroAtual = "analise";

async function entrar() {
  const email = document.getElementById("email").value.trim();
  const senha = document.getElementById("senha").value.trim();
  if (!email || !senha) return;

  try {
    await auth.signInWithEmailAndPassword(email, senha);
    document.getElementById("telaLogin").classList.add("hidden");
    document.getElementById("painel").classList.remove("hidden");
    carregarLista();
  } catch {
    document.getElementById("avisoErro").classList.remove("hidden");
    setTimeout(() => document.getElementById("avisoErro").classList.add("hidden"), 3000);
  }
}

function sair() {
  auth.signOut();
  document.getElementById("painel").classList.add("hidden");
  document.getElementById("telaLogin").classList.remove("hidden");
  document.getElementById("email").value = "";
  document.getElementById("senha").value = "";
}

async function carregarLista() {
  const ref = filtroAtual === "todos"
    ? db.collection("grupos").orderBy("dataEnvio", "desc")
    : db.collection("grupos").where("status", "==", filtroAtual).orderBy("dataEnvio", "desc");

  const snap = await ref.get();
  const container = document.getElementById("listaGrupos");
  container.innerHTML = "";

  if (snap.empty) {
    container.innerHTML = "<p class='text-center text-gray-500 py-10'>Nenhum grupo encontrado</p>";
    return;
  }

  snap.docs.forEach(doc => {
    const g = { id: doc.id, ...doc.data() };
    container.innerHTML += `
      <div class="border rounded p-4 flex flex-col md:flex-row justify-between items-center gap-4">
        <div>
          <strong>${g.nome}</strong> | ${g.categoria}<br>
          <span class="text-sm ${g.status === 'aprovado' ? 'text-green-600' : 'text-yellow-600'}">${g.status}</span>
        </div>
        <div class="flex gap-2">
          <button onclick="alterar('${g.id}', 'aprovado')" class="bg-green-600 text-white px-2 py-1 rounded">✅ Aprovar</button>
          <button onclick="alterar('${g.id}', 'recusado')" class="bg-red-600 text-white px-2 py-1 rounded">❌ Recusar</button>
          <button onclick="apagar('${g.id}')" class="bg-gray-700 text-white px-2 py-1 rounded">🗑️ Apagar</button>
        </div>
      </div>
    `;
  });
}

async function alterar(id, novoStatus) {
  try {
    await db.collection("grupos").doc(id).update({ status: novoStatus });
    carregarLista();
    alert("✅ Feito!");
  } catch {
    alert("❌ Sem permissão!");
  }
}

async function apagar(id) {
  if (!confirm("Tem certeza?")) return;
  try {
    await db.collection("grupos").doc(id).delete();
    carregarLista();
    alert("✅ Apagado!");
  } catch {
    alert("❌ Sem permissão!");
  }
}

function filtrar(tipo) {
  filtroAtual = tipo;
  carregarLista();
}
</script>

</body>
</html>
