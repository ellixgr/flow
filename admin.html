<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4">

<!-- Tela de senha antes de carregar tudo -->
<div id="telaSenha" class="max-w-md mx-auto mt-20 bg-white p-6 rounded shadow-lg">
    <h2 class="text-xl font-bold text-center mb-6">🔐 Acesso ao Painel</h2>
    <input type="password" id="senhaDigitada" class="w-full border p-3 rounded mb-4" placeholder="Digite sua senha">
    <button onclick="entrar()" class="w-full bg-green-600 text-white p-3 rounded font-medium">Entrar</button>
    <p id="aviso" class="text-red-600 text-center mt-3 hidden">Senha incorreta!</p>
</div>

<!-- Painel só aparece depois de digitar -->
<div id="painel" class="hidden max-w-5xl mx-auto">
    <div class="bg-white rounded shadow p-6 mb-4 flex justify-between items-center">
        <h1 class="text-2xl font-bold">📋 Gerenciar Grupos</h1>
        <button onclick="sair()" class="bg-red-500 text-white px-3 py-1 rounded">Sair</button>
    </div>

    <div class="bg-white rounded shadow p-4 mb-4 flex gap-2">
        <button onclick="filtrar('analise')" class="bg-yellow-500 text-white px-3 py-1 rounded">Pendentes</button>
        <button onclick="filtrar('aprovado')" class="bg-green-500 text-white px-3 py-1 rounded">Aprovados</button>
        <button onclick="filtrar('todos')" class="bg-gray-500 text-white px-3 py-1 rounded">Todos</button>
    </div>

    <div id="listaGrupos" class="space-y-4"></div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCbn1DaAw4Uz5MzNDKGfL7O2fPXbhswuXM",
  authDomain: "almanaque-2d45c.firebaseapp.com",
  projectId: "almanaque-2d45c",
  storageBucket: "almanaque-2d45c.firebasestorage.app",
  messagingSenderId: "438098113685",
  appId: "1:438098113685:web:ee38a615cdf1166be9979c"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
let senhaAtual = "";
let filtro = "analise";

function entrar() {
    senhaAtual = document.getElementById("senhaDigitada").value.trim();
    if (!senhaAtual) return;

    // Abre o painel para ver a lista (ver é permitido para todos)
    document.getElementById("telaSenha").classList.add("hidden");
    document.getElementById("painel").classList.remove("hidden");
    carregarLista();
}

function sair() {
    senhaAtual = "";
    document.getElementById("painel").classList.add("hidden");
    document.getElementById("telaSenha").classList.remove("hidden");
    document.getElementById("senhaDigitada").value = "";
}

async function carregarLista() {
    const ref = filtro === "todos" 
        ? db.collection("grupos").orderBy("dataEnvio", "desc")
        : db.collection("grupos").where("status", "==", filtro).orderBy("dataEnvio", "desc");

    const snap = await ref.get();
    const container = document.getElementById("listaGrupos");
    container.innerHTML = "";

    if (snap.empty) {
        container.innerHTML = "<p class='text-center text-gray-500 py-10'>Nenhum grupo encontrado</p>";
        return;
    }

    snap.docs.forEach(doc => {
        const g = { id: doc.id, ...doc.data() };
        const div = document.createElement("div");
        div.className = "border rounded p-4 flex flex-col md:flex-row gap-4 items-center justify-between";

        div.innerHTML = `
            <div class="flex items-center gap-4">
                <img src="${g.foto}" class="w-16 h-16 rounded-full object-cover">
                <div>
                    <h3 class="font-bold">${g.nome}</h3>
                    <p class="text-sm text-gray-600">${g.categoria.toUpperCase()}</p>
                    <p class="text-xs text-gray-500">${g.descricao}</p>
                    <a href="${g.link}" target="_blank" class="text-blue-600 text-xs">Abrir link</a>
                </div>
            </div>
            <div class="flex gap-2">
                <span class="px-2 py-1 rounded text-xs ${g.status==='analise'?'bg-yellow-100':'bg-green-100'}">${g.status.toUpperCase()}</span>
                <button onclick="mudarStatus('${g.id}', 'aprovado')" class="bg-green-600 text-white px-2 py-1 rounded text-sm">✅ Aprovar</button>
                <button onclick="mudarStatus('${g.id}', 'recusado')" class="bg-red-600 text-white px-2 py-1 rounded text-sm">❌ Não Aprovar</button>
                <button onclick="apagarGrupo('${g.id}')" class="bg-gray-700 text-white px-2 py-1 rounded text-sm">🗑️ Apagar</button>
            </div>
        `;
        container.appendChild(div);
    });
}

// ✅ AQUI A SENHA É VALIDADA PELO BANCO, SEMPRE
async function mudarStatus(id, novoStatus) {
    try {
        await db.collection("grupos").doc(id).update({
            status: novoStatus,
            _segredo_admin: senhaAtual
        });
        carregarLista();
        alert("✅ Feito!");
    } catch (erro) {
        console.log(erro);
        alert("❌ Senha incorreta ou sem permissão!");
    }
}

async function apagarGrupo(id) {
    if (!confirm("Apagar esse grupo?")) return;
    try {
        await db.collection("grupos").doc(id).delete({
            _segredo_admin: senhaAtual
        });
        carregarLista();
        alert("✅ Apagado!");
    } catch {
        alert("❌ Senha incorreta!");
    }
}

function filtrar(tipo) {
    filtro = tipo;
    carregarLista();
}
</script>
</body>
</html>
